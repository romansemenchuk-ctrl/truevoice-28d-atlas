name: Academy Feature CI

on:
  push:
    branches:
      - feat/academy-access-wayforpay-20260910
  pull_request:
    branches:
      - feat/academy-qa-20260908

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:all
      - run: npm audit --omit=dev
      - run: git diff --check 7c2c25ae693f1f04d84df85f446a34600fe861d4 HEAD
