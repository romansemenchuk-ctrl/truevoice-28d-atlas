name: Academy Feature CI

on:
  push:
    branches:
      - feat/academy-access-wayforpay-20260910
  pull_request:
    branches:
      - feat/academy-qa-20260908

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/members-browser.cjs
      - run: node tests/mechanics-browser.cjs
